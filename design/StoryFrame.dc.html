<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Lora', Georgia, serif; }
    a { color: #c89858; } a:hover { color: #f4e8c8; }
  </style>
</helmet>
<div style="width: 1080px; height: 1920px; background: #141a3e; position: relative; overflow: hidden;">

  <!-- Radial glow -->
  <div style="position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(200,152,88,0.06) 0%, transparent 70%); pointer-events: none;"></div>

  <!-- Stars -->
  <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 50%; pointer-events: none;" viewBox="0 0 1080 960">
    <circle cx="100" cy="80" r="2" fill="#f4e8c8" opacity="0.4"/>
    <circle cx="300" cy="50" r="1.5" fill="#f4e8c8" opacity="0.3"/>
    <circle cx="520" cy="100" r="2.5" fill="#f4e8c8" opacity="0.5"/>
    <circle cx="780" cy="70" r="2" fill="#f4e8c8" opacity="0.35"/>
    <circle cx="950" cy="120" r="1.5" fill="#f4e8c8" opacity="0.3"/>
    <circle cx="200" cy="200" r="1" fill="#f4e8c8" opacity="0.2"/>
    <circle cx="640" cy="180" r="1.5" fill="#f4e8c8" opacity="0.25"/>
    <circle cx="880" cy="250" r="2" fill="#f4e8c8" opacity="0.3"/>
  </svg>

  <!-- Branding bar -->
  <div style="position: absolute; top: 50px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;">
    <svg width="24" height="24" viewBox="0 0 28 28">
      <path d="M14 2 L17 10 L26 10 L19 15 L22 24 L14 19 L6 24 L9 15 L2 10 L11 10 Z" fill="#c89858"/>
    </svg>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 20px; color: #f4e8c8;">the resistance night</div>
  </div>

  <!-- Story label -->
  <div style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%);">
    <span style="font-family: 'Lora', Georgia, serif; font-size: 13px; color: #c89858; letter-spacing: 4px; text-transform: uppercase; opacity: 0.7;">{{storyLabel}}</span>
  </div>

  <!-- Role reveal card -->
  <div style="position: absolute; top: 200px; left: 50%; transform: translateX(-50%); width: 680px;">
    <div style="border: 1px solid rgba(200,152,88,0.3); padding: 60px 50px; text-align: center; background: rgba(28,36,84,0.6);">
      <!-- Role sigil -->
      <svg width="60" height="60" viewBox="0 0 60 60" style="margin-bottom: 24px;">
        <circle cx="30" cy="30" r="26" fill="none" stroke="#c89858" stroke-width="1.5" opacity="0.5"/>
        <path d="M30 8 L34 22 L48 22 L37 30 L41 44 L30 36 L19 44 L23 30 L12 22 L26 22 Z" fill="#c89858" opacity="0.7"/>
      </svg>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 72px; color: #f4e8c8; line-height: 1; margin-bottom: 16px;">{{roleName}}</div>
      <div style="font-family: 'Lora', Georgia, serif; font-size: 16px; color: #c89858; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px;">{{roleAlignment}}</div>
      <!-- Divider -->
      <svg width="120" height="10" viewBox="0 0 120 10" style="margin-bottom: 28px;">
        <line x1="0" y1="5" x2="45" y2="5" stroke="#c89858" stroke-width="1" opacity="0.4"/>
        <line x1="75" y1="5" x2="120" y2="5" stroke="#c89858" stroke-width="1" opacity="0.4"/>
        <circle cx="60" cy="5" r="3" fill="none" stroke="#c89858" stroke-width="1" opacity="0.5"/>
      </svg>
      <p style="font-family: 'Lora', Georgia, serif; font-size: 22px; color: #8a92b8; line-height: 1.6; margin: 0;">{{roleDescription}}</p>
    </div>
  </div>

  <!-- Interactive poll area -->
  <div style="position: absolute; bottom: 500px; left: 100px; right: 100px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 36px; color: #f4e8c8;">{{pollQuestion}}</span>
    </div>
    <div style="display: flex; gap: 20px;">
      <div style="flex: 1; border: 2px solid rgba(200,152,88,0.4); padding: 22px; text-align: center; background: rgba(200,152,88,0.05);">
        <span style="font-family: 'Lora', Georgia, serif; font-size: 20px; color: #f4e8c8;">{{optionA}}</span>
      </div>
      <div style="flex: 1; border: 2px solid rgba(200,152,88,0.4); padding: 22px; text-align: center; background: rgba(200,152,88,0.05);">
        <span style="font-family: 'Lora', Georgia, serif; font-size: 20px; color: #f4e8c8;">{{optionB}}</span>
      </div>
    </div>
  </div>

  <!-- Countdown / timer area -->
  <div style="position: absolute; bottom: 320px; left: 50%; transform: translateX(-50%); text-align: center;">
    <div style="font-family: 'Lora', Georgia, serif; font-size: 13px; color: #c89858; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px;">{{countdownLabel}}</div>
    <div style="display: flex; gap: 24px; align-items: center;">
      <div style="text-align: center;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 56px; color: #f4e8c8; line-height: 1;">{{days}}</div>
        <div style="font-family: 'Lora', Georgia, serif; font-size: 11px; color: #8a92b8; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;">days</div>
      </div>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; color: #c89858; opacity: 0.4;">:</div>
      <div style="text-align: center;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 56px; color: #f4e8c8; line-height: 1;">{{hours}}</div>
        <div style="font-family: 'Lora', Georgia, serif; font-size: 11px; color: #8a92b8; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;">hours</div>
      </div>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; color: #c89858; opacity: 0.4;">:</div>
      <div style="text-align: center;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 56px; color: #f4e8c8; line-height: 1;">{{mins}}</div>
        <div style="font-family: 'Lora', Georgia, serif; font-size: 11px; color: #8a92b8; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;">mins</div>
      </div>
    </div>
  </div>

  <!-- Hashtags -->
  <div style="position: absolute; bottom: 200px; left: 60px; right: 60px; text-align: center;">
    <span style="font-family: 'Lora', Georgia, serif; font-size: 15px; color: #c89858; opacity: 0.5; letter-spacing: 1px;">{{hashtags}}</span>
  </div>

  <!-- Swipe up CTA -->
  <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); text-align: center;">
    <svg width="30" height="30" viewBox="0 0 30 30" style="margin-bottom: 8px;">
      <path d="M8 20 L15 12 L22 20" fill="none" stroke="#c89858" stroke-width="2"/>
      <path d="M8 26 L15 18 L22 26" fill="none" stroke="#c89858" stroke-width="2" opacity="0.4"/>
    </svg>
    <div style="font-family: 'Lora', Georgia, serif; font-size: 12px; color: #c89858; letter-spacing: 3px; text-transform: uppercase; opacity: 0.6;">{{swipeCta}}</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"storyLabel":{"editor":"text","default":"Role Reveal"},"roleName":{"editor":"text","default":"Percival"},"roleAlignment":{"editor":"text","default":"Loyal Servant of Arthur"},"roleDescription":{"editor":"text","default":"You see two players glow. One is Merlin, your guide. The other is Morgana, the deceiver. But which is which?"},"pollQuestion":{"editor":"text","default":"Which would you trust?"},"optionA":{"editor":"text","default":"The quiet one"},"optionB":{"editor":"text","default":"The loudest voice"},"countdownLabel":{"editor":"text","default":"Next Game Night"},"days":{"editor":"text","default":"03"},"hours":{"editor":"text","default":"14"},"mins":{"editor":"text","default":"27"},"hashtags":{"editor":"text","default":"#TheResistanceNight #GameNight #SocialDeduction"},"swipeCta":{"editor":"text","default":"Swipe up to play"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      storyLabel: this.props.storyLabel ?? 'Role Reveal',
      roleName: this.props.roleName ?? 'Percival',
      roleAlignment: this.props.roleAlignment ?? 'Loyal Servant of Arthur',
      roleDescription: this.props.roleDescription ?? 'You see two players glow. One is Merlin, your guide. The other is Morgana, the deceiver. But which is which?',
      pollQuestion: this.props.pollQuestion ?? 'Which would you trust?',
      optionA: this.props.optionA ?? 'The quiet one',
      optionB: this.props.optionB ?? 'The loudest voice',
      countdownLabel: this.props.countdownLabel ?? 'Next Game Night',
      days: this.props.days ?? '03',
      hours: this.props.hours ?? '14',
      mins: this.props.mins ?? '27',
      hashtags: this.props.hashtags ?? '#TheResistanceNight #GameNight #SocialDeduction',
      swipeCta: this.props.swipeCta ?? 'Swipe up to play',
    };
  }
}
</script>
</body>
</html>
