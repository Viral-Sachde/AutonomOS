<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Lora', Georgia, serif; }
    a { color: #c89858; } a:hover { color: #f4e8c8; }
  </style>
</helmet>
<div style="width: 1080px; height: 1920px; background: #141a3e; position: relative; overflow: hidden;">

  <!-- Full-height gradient overlay -->
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, transparent 0%, rgba(20,26,62,0.3) 40%, rgba(20,26,62,0.85) 70%, #141a3e 100%);"></div>

  <!-- Stars -->
  <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 60%; pointer-events: none;" viewBox="0 0 1080 1152">
    <circle cx="80" cy="60" r="2.5" fill="#f4e8c8" opacity="0.5"/>
    <circle cx="260" cy="120" r="1.5" fill="#f4e8c8" opacity="0.3"/>
    <circle cx="440" cy="40" r="3" fill="#f4e8c8" opacity="0.6"/>
    <circle cx="680" cy="90" r="2" fill="#f4e8c8" opacity="0.4"/>
    <circle cx="900" cy="55" r="2.5" fill="#f4e8c8" opacity="0.45"/>
    <circle cx="150" cy="220" r="1" fill="#f4e8c8" opacity="0.25"/>
    <circle cx="820" cy="200" r="1.5" fill="#f4e8c8" opacity="0.3"/>
    <circle cx="540" cy="280" r="2" fill="#f4e8c8" opacity="0.35"/>
    <circle cx="350" cy="350" r="1.5" fill="#f4e8c8" opacity="0.2"/>
    <circle cx="750" cy="320" r="1" fill="#f4e8c8" opacity="0.25"/>
    <circle cx="980" cy="160" r="1.5" fill="#f4e8c8" opacity="0.3"/>
    <circle cx="60" cy="400" r="2" fill="#f4e8c8" opacity="0.2"/>
  </svg>

  <!-- Large crescent moon -->
  <svg style="position: absolute; top: 80px; right: 80px; width: 160px; height: 160px;" viewBox="0 0 160 160">
    <circle cx="80" cy="80" r="58" fill="#c89858" opacity="0.85"/>
    <circle cx="98" cy="68" r="44" fill="#141a3e"/>
  </svg>

  <!-- Castle panorama -->
  <svg style="position: absolute; bottom: 580px; left: 0; width: 100%; height: 200px; pointer-events: none;" viewBox="0 0 1080 200">
    <g fill="#1c2454" opacity="0.5">
      <rect x="0" y="100" width="1080" height="100"/>
      <!-- Left castle -->
      <rect x="40" y="40" width="60" height="60"/>
      <rect x="50" y="20" width="15" height="20"/>
      <rect x="80" y="25" width="12" height="15"/>
      <rect x="120" y="60" width="50" height="40"/>
      <rect x="130" y="40" width="10" height="20"/>
      <rect x="150" y="45" width="10" height="15"/>
      <!-- Center towers -->
      <rect x="380" y="30" width="70" height="70"/>
      <rect x="395" y="5" width="16" height="25"/>
      <rect x="425" y="10" width="14" height="20"/>
      <rect x="480" y="50" width="50" height="50"/>
      <rect x="490" y="30" width="12" height="20"/>
      <rect x="560" y="40" width="60" height="60"/>
      <rect x="575" y="15" width="14" height="25"/>
      <rect x="600" y="20" width="12" height="20"/>
      <!-- Right castle -->
      <rect x="800" y="45" width="55" height="55"/>
      <rect x="810" y="25" width="14" height="20"/>
      <rect x="835" y="30" width="10" height="15"/>
      <rect x="880" y="55" width="70" height="45"/>
      <rect x="900" y="35" width="12" height="20"/>
      <rect x="930" y="40" width="10" height="15"/>
      <rect x="980" y="50" width="60" height="50"/>
      <rect x="995" y="30" width="14" height="20"/>
    </g>
  </svg>

  <!-- Branding bar top -->
  <div style="position: absolute; top: 60px; left: 60px; display: flex; align-items: center; gap: 14px;">
    <svg width="32" height="32" viewBox="0 0 28 28">
      <path d="M14 2 L17 10 L26 10 L19 15 L22 24 L14 19 L6 24 L9 15 L2 10 L11 10 Z" fill="#c89858"/>
    </svg>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 24px; color: #f4e8c8;">the resistance night</div>
  </div>

  <!-- Large dramatic headline -->
  <div style="position: absolute; bottom: 620px; left: 60px; right: 60px; text-align: center;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 96px; color: #f4e8c8; line-height: 1.05;">{{headline}}</div>
  </div>

  <!-- Ornamental divider -->
  <svg style="position: absolute; bottom: 560px; left: 50%; transform: translateX(-50%); width: 400px; height: 30px;" viewBox="0 0 400 30">
    <line x1="20" y1="15" x2="170" y2="15" stroke="#c89858" stroke-width="1" opacity="0.5"/>
    <line x1="230" y1="15" x2="380" y2="15" stroke="#c89858" stroke-width="1" opacity="0.5"/>
    <path d="M180 6 L200 15 L220 6 L220 24 L200 15 L180 24 Z" fill="#c89858" opacity="0.7"/>
  </svg>

  <!-- Body text -->
  <div style="position: absolute; bottom: 380px; left: 80px; right: 80px; text-align: center;">
    <p style="font-family: 'Lora', Georgia, serif; font-size: 28px; color: #8a92b8; line-height: 1.5; margin: 0;">{{body}}</p>
  </div>

  <!-- CTA button -->
  <div style="position: absolute; bottom: 260px; left: 50%; transform: translateX(-50%);">
    <div style="display: inline-block; border: 2px solid #c89858; padding: 18px 56px; font-family: 'Lora', Georgia, serif; font-size: 22px; color: #f4e8c8; letter-spacing: 3px; text-transform: uppercase;">{{cta}}</div>
  </div>

  <!-- Hashtags -->
  <div style="position: absolute; bottom: 170px; left: 60px; right: 60px; text-align: center;">
    <span style="font-family: 'Lora', Georgia, serif; font-size: 16px; color: #c89858; opacity: 0.6; letter-spacing: 1px;">{{hashtags}}</span>
  </div>

  <!-- Swipe indicator -->
  <div style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); text-align: center;">
    <svg width="40" height="40" viewBox="0 0 40 40" style="opacity: 0.5;">
      <path d="M10 18 L20 28 L30 18" fill="none" stroke="#c89858" stroke-width="2"/>
      <path d="M10 10 L20 20 L30 10" fill="none" stroke="#c89858" stroke-width="2" opacity="0.4"/>
    </svg>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"headline":{"editor":"text","default":"Trust No One"},"body":{"editor":"text","default":"In a kingdom of shadows and secrets, loyalty is the deadliest weapon."},"cta":{"editor":"text","default":"Watch Now"},"hashtags":{"editor":"text","default":"#TheResistanceNight #HiddenRoles #Reels"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      headline: this.props.headline ?? 'Trust No One',
      body: this.props.body ?? 'In a kingdom of shadows and secrets, loyalty is the deadliest weapon.',
      cta: this.props.cta ?? 'Watch Now',
      hashtags: this.props.hashtags ?? '#TheResistanceNight #HiddenRoles #Reels',
    };
  }
}
</script>
</body>
</html>
